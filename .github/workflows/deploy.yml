# Example consumer workflow for the ipfs-gh-pages reusable action.
#
# By default this tracks the action repo's current state: the newest v* tag
# (currently v2.7.8) is auto-detected at run time, falling back to the
# default-branch HEAD when no tag exists. Pin a specific ref instead via
# workflow_dispatch (action_ref) or by setting REF explicitly below.

name: Deploy IPFS site

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      action_ref:
        description: 'Action ref (SHA, branch, or tag e.g. v2.7.8). Empty = auto-detect newest v* tag, else default-branch HEAD.'
        required: false
        default: ''
        type: string
      node_version:
        description: 'Node.js version to use for the build'
        required: true
        default: '20'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Determine Action Ref and Node Version
        id: set-inputs
        run: |
          # Pin explicitly via workflow_dispatch; otherwise auto-detect the
          # action repo's current state: newest v* tag, else HEAD.
          REF="${{ github.event.inputs.action_ref }}"
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --refs --tags --sort=-v:refname https://github.com/RandyMcMillan/ipfs-gh-pages.git 'v*' | head -n 1 | cut -f2 | sed 's|^refs/tags/||')
            if [ -n "$REF" ]; then
              echo "Auto-detected newest tag of RandyMcMillan/ipfs-gh-pages: $REF"
            else
              REF=$(git ls-remote https://github.com/RandyMcMillan/ipfs-gh-pages.git HEAD | cut -f1)
              echo "No v* tags found — using default-branch HEAD: $REF"
            fi
          fi
          echo "action_ref=$REF" >> $GITHUB_OUTPUT
          echo "Using action ref: $REF"

          NODE_VER="${{ github.event.inputs.node_version }}"
          if [ -z "$NODE_VER" ]; then
            NODE_VER="20"
          fi
          echo "node_version=$NODE_VER" >> $GITHUB_OUTPUT
          echo "Using Node version: $NODE_VER"

      - name: Checkout Action Repository and Pull Tags
        uses: actions/checkout@v4
        with:
          repository: RandyMcMillan/ipfs-gh-pages
          ref: ${{ steps.set-inputs.outputs.action_ref }}
          path: temp-action-repo
          fetch-tags: true # Ensures tags are fetched during checkout

      - name: Print Diff (Selected Ref vs Main Branch)
        run: |
          echo "=========================================="
          echo "Comparing selected ref (${{ steps.set-inputs.outputs.action_ref }}) vs main"
          echo "=========================================="
          cd temp-action-repo
          git fetch --tags origin
          git fetch origin main || git fetch origin master || true
          git diff ${{ steps.set-inputs.outputs.action_ref }} origin/main || git diff ${{ steps.set-inputs.outputs.action_ref }} origin/master || true

      - name: Build and deploy IPFS site
        id: drier
        uses: ./temp-action-repo
        with:
          node-version: ${{ steps.set-inputs.outputs.node_version }}
          deploy: 'true'
