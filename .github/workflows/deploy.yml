name: Deploy Helia App to GitHub Pages

on:
  push:
    branches:
      - main
      - 'test-**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      run-tests:
        description: 'Run the full test suite before deploying'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Only main deploys share the serial 'pages' group; branch test runs get
  # their own per-ref group so they never cancel a main deployment.
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    # Full suite gates PRs, release tags, test-* branches, and dispatches that
    # opt in — main pushes deploy immediately (rapid dev); release.yml also
    # tests every tag.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/test-') || (github.event_name == 'workflow_dispatch' && inputs['run-tests'])
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/test-setup

      - name: Run Tests
        run: npm run test:ci

  deploy:
    needs: test
    # Run when the test job passed OR was skipped (branch pushes); never on tags.
    if: always() && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page-url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        # Submodules intentionally NOT checked out here: the gitlink guard
        # below runs first, so a bad push order fails with a clear message
        # instead of checkout's cryptic "upload-pack: not our ref".

      - name: Verify submodule gitlinks resolve on their remotes
        run: node scripts/check-gitlink.mjs

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Build and deploy via the action
        id: deploy
        uses: ./
        with:
          deploy: 'true'

  smoke-test:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/test-setup

      - name: Wait for Pages deployment
        run: |
          url="${{ needs.deploy.outputs.page_url }}"
          echo "Waiting for $url"
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" "$url" | grep -q "200"; then
              echo "Pages site is live"
              break
            fi
            sleep 2
          done

      - name: Run tests against deployed site
        env:
          TEST_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:ci